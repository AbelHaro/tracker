[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "tracker-cpp"
version = "0.1.0"
description = "C++ ByteTrack tracker with Python bindings"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["numpy>=2.3.2"]

[tool.scikit-build]
wheel.packages = []
sdist.include = ["CMakeLists.txt", "bindings/**", "include/**", "src/**"]
sdist.exclude = ["examples/**", ".agents/**", ".codex/**"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "bindings/**/*.cpp" },
    { file = "bindings/**/*.pyi" },
    { file = "src/**/*.cpp" },
    { file = "include/**/*.hpp" },
    { file = "include/**/*.h" },
]

[tool.uv.workspace]
members = [
    "examples/yolo",
]

[dependency-groups]
dev = [
    "pybind11-stubgen>=2.5.5",
]
